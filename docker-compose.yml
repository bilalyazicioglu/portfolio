services:
  blog:
    container_name: blog
    build:
      context: .
      dockerfile: Dockerfile
    # Bound to loopback on purpose: the only ways in are the public reverse
    # proxy (nginx :443, behind Cloudflare) and `tailscale serve`. Exposing this
    # on 0.0.0.0 would let anyone with the VPS IP bypass both and reach /admin.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - BLOG_DIR_PATH=/app/content/blog
      # Admin gate — see src/lib/admin-gate.ts. Fails closed if the request did
      # not arrive over the tailnet.
      - ADMIN_TAILNET_HOST=${ADMIN_TAILNET_HOST:-}
      - ADMIN_TAILSCALE_LOGIN=${ADMIN_TAILSCALE_LOGIN:-}
    volumes:
      - views-data:/app/data
      - content-data:/app/content
    restart: unless-stopped
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.rootfs=/host
    pid: host
    restart: unless-stopped
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    expose:
      - "9100"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    networks:
      - monitoring
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - ./monitoring/geolite2:/data/geolite2:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring

networks:
  monitoring:

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  views-data:
  content-data:
